name: Orbit release validation

on:
  pull_request:
    branches:
      - orbit-v4.4
      - orbit-v4.5.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build TypeScript and Vite
        run: npm run build
      - name: Unit and server tests
        run: npm test
      - name: Install Chromium
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - name: Install media test dependency
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg
          fi
      - name: Start Orbit dev server
        run: |
          npm run dev > /tmp/orbit-dev.log 2>&1 &
          echo $! > /tmp/orbit-dev.pid
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/orbit-dev.log
          exit 1
      - name: Immersive Home E2E
        run: npm run test:home
      - name: Scene-first Home acceptance
        run: npm run test:scene
      - name: Home drag and control regression
        run: npm run test:interaction
      - name: Orbit 4.5 all-widget and module acceptance
        run: npm run test:v45
      - name: Orbit 4.6 module workflows
        run: npm run test:v46
      - name: Shopping storage recovery
        run: npm run test:shopping-storage
      - name: V2 regression
        run: npm run test:e2e
      - name: V3 regression
        run: npm run test:v3
      - name: V3.1 regression
        run: npm run test:v31
      - name: V4 regression
        run: npm run test:v4
      - name: Print development server log on failure
        if: failure()
        run: cat /tmp/orbit-dev.log || true
